name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:boundaries
      # Las pruebas de integración levantan un PostgreSQL 17 embebido (sin servicios externos).
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgres://app_user:unused@localhost:5432/unused
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-build-secret-ci-build-secret-0123456
          AUDIT_IP_PEPPER: ci-build-pepper-0123
